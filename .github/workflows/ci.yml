name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillforge_test
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillforge -d skillforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: CiOnly-Test-Password-123!
      DATABASE_URL: postgresql+psycopg://skillforge:test-password@localhost:5432/skillforge_test
      TEST_DATABASE_BACKEND: postgresql
      MIGRATE_LEGACY_AUTH_DATA: "0"
      ALLOWED_ORIGINS: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
